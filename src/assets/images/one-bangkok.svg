<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One Bangkok project">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00d9ff" />
    </linearGradient>
    <style>
      .bg{fill:#0f1419}
      .grade{fill:url(#g)}
      .title{font-family: sans-serif; font-weight:700; font-size:48px; fill: #ffffff}
      .subtitle{font-family: sans-serif; font-size:20px; fill: #ffffff; opacity:0.9}
      .skyline{fill:#ffffff; opacity:0.9}
    </style>
  </defs>
  <rect width="1200" height="800" class="bg" />
  <g transform="translate(120,100)">
    <rect x="0" y="420" width="960" height="20" fill="#0b1216" opacity="0.6" />
    <!-- simple skyline shapes -->
    <rect x="60" y="300" width="60" height="140" class="skyline" />
    <rect x="140" y="260" width="40" height="180" class="skyline" />
    <rect x="200" y="200" width="80" height="240" class="skyline" />
    <rect x="300" y="140" width="90" height="300" class="skyline" />
    <rect x="420" y="180" width="60" height="260" class="skyline" />
    <rect x="520" y="100" width="120" height="340" class="skyline" />
    <rect x="660" y="220" width="40" height="220" class="skyline" />
    <rect x="740" y="160" width="70" height="280" class="skyline" />
    <rect x="840" y="240" width="60" height="200" class="skyline" />
  </g>
  <g transform="translate(80,560)">
    <text class="title">ONE BANGKOK</text>
    <text x="0" y="36" class="subtitle">Project Site</text>
  </g>
</svg>
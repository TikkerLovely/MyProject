<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Jump Game</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #161a22;
      --text: #f4f7ff;
      --accent: #8bc5ff;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #1f2a3b, var(--bg) 45%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .game-shell {
      width: min(920px, 100%);
      background: rgba(22, 26, 34, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      padding: 16px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .score {
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--accent);
      color: #031225;
      font-weight: 600;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px) scale(0.99); }

    .hint {
      margin-top: 10px;
      color: rgba(244, 247, 255, 0.85);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .canvas-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(#111827, #0d1320);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.22);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .overlay.show { opacity: 1; }

    .overlay h1 {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 2rem);
    }

    .overlay p {
      margin: 8px 0 0;
      color: #d5e8ff;
    }

    .danger { color: var(--danger); }

    @media (max-width: 600px) {
      .game-shell { padding: 12px; }
      button { width: 100%; }
      .controls { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <div class="top-bar">
      <div>
        <div class="score" id="scoreLabel">SCORE: 00000 | BEST: 00000</div>
      </div>
      <div class="controls">
        <button id="startBtn">เริ่ม / รีสตาร์ท</button>
        <button id="jumpBtn">กระโดด</button>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="880" height="260" aria-label="Offline Jump Game" role="img"></canvas>
      <div class="overlay show" id="overlay">
        <div>
          <h1>🦖 Offline Jump Game</h1>
          <p>กด <strong>Space</strong> / <strong>↑</strong> หรือปุ่ม <strong>กระโดด</strong> เพื่อเล่น</p>
        </div>
      </div>
    </div>

    <p class="hint">
      เกมเล่นแบบออฟไลน์ได้ทันที: เปิดไฟล์นี้แล้วเล่นได้เลย (ไม่ต้องใช้อินเทอร์เน็ต) • บนมือถือแตะปุ่ม <strong>กระโดด</strong>
    </p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreLabel = document.getElementById('scoreLabel');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const jumpBtn = document.getElementById('jumpBtn');

    const groundY = 210;
    const gravity = 0.78;
    const jumpForce = -13.5;

    let best = Number(localStorage.getItem('offline-jump-best') || 0);
    let state;

    function reset() {
      state = {
        running: true,
        gameOver: false,
        distance: 0,
        speed: 6,
        spawnTimer: 0,
        player: { x: 80, y: groundY, w: 34, h: 42, vy: 0, onGround: true },
        obstacles: [],
        clouds: Array.from({ length: 4 }, (_, i) => ({
          x: 120 + i * 240,
          y: 20 + Math.random() * 60,
          s: 0.5 + Math.random() * 0.8
        }))
      };
      overlay.classList.remove('show');
      overlay.innerHTML = '';
    }

    function jump() {
      if (!state.running) {
        reset();
      }
      if (state.player.onGround) {
        state.player.vy = jumpForce;
        state.player.onGround = false;
      }
    }

    function spawnObstacle() {
      const tall = Math.random() > 0.5;
      state.obstacles.push({
        x: canvas.width + 20,
        y: groundY,
        w: tall ? 22 : 30,
        h: tall ? 54 : 36,
      });
    }

    function collide(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function update() {
      if (!state.running) return;

      state.distance += 0.12;
      state.speed += 0.0014;

      const p = state.player;
      p.vy += gravity;
      p.y += p.vy;

      if (p.y >= groundY) {
        p.y = groundY;
        p.vy = 0;
        p.onGround = true;
      }

      state.spawnTimer -= 1;
      if (state.spawnTimer <= 0) {
        spawnObstacle();
        state.spawnTimer = 55 + Math.random() * 80 - Math.min(25, state.distance * 0.12);
      }

      for (const c of state.clouds) {
        c.x -= c.s;
        if (c.x < -60) {
          c.x = canvas.width + Math.random() * 100;
          c.y = 20 + Math.random() * 70;
        }
      }

      for (const ob of state.obstacles) {
        ob.x -= state.speed;
      }

      state.obstacles = state.obstacles.filter((ob) => ob.x + ob.w > -10);

      const hitbox = {
        x: p.x + 5,
        y: p.y - p.h + 6,
        w: p.w - 10,
        h: p.h - 6,
      };

      for (const ob of state.obstacles) {
        const obstacleHitbox = { x: ob.x + 1, y: ob.y - ob.h, w: ob.w - 2, h: ob.h };
        if (collide(hitbox, obstacleHitbox)) {
          state.running = false;
          state.gameOver = true;
          const score = Math.floor(state.distance);
          if (score > best) {
            best = score;
            localStorage.setItem('offline-jump-best', String(best));
          }
          overlay.innerHTML = `
            <div>
              <h1 class="danger">Game Over</h1>
              <p>คะแนน: <strong>${String(score).padStart(5, '0')}</strong></p>
              <p>กด Space, ↑ หรือปุ่มเริ่มเพื่อเล่นใหม่</p>
            </div>`;
          overlay.classList.add('show');
          break;
        }
      }

      const current = Math.floor(state.distance);
      scoreLabel.textContent = `SCORE: ${String(current).padStart(5, '0')} | BEST: ${String(best).padStart(5, '0')}`;
    }

    function drawDino(p) {
      const x = p.x;
      const y = p.y - p.h;
      ctx.fillStyle = '#d0e7ff';
      ctx.fillRect(x + 8, y + 8, 18, 24);
      ctx.fillRect(x + 22, y, 12, 14);
      ctx.fillRect(x + 4, y + 12, 8, 10);
      ctx.fillRect(x + 10, y + 32, 6, 10);
      ctx.fillRect(x + 20, y + 32, 6, 10);
      ctx.fillStyle = '#0d1320';
      ctx.fillRect(x + 28, y + 6, 3, 3);
    }

    function drawCloud(c) {
      ctx.fillStyle = 'rgba(220, 235, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, 12 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 14 * c.s, c.y + 2, 10 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x - 12 * c.s, c.y + 3, 8 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#1d293b');
      sky.addColorStop(1, '#0f1624');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      state.clouds.forEach(drawCloud);

      ctx.strokeStyle = '#9ab8db';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY + 0.5);
      ctx.lineTo(canvas.width, groundY + 0.5);
      ctx.stroke();

      ctx.fillStyle = '#89c166';
      for (let i = 0; i < canvas.width; i += 20) {
        const h = 3 + ((i + Math.floor(state.distance * 10)) % 8);
        ctx.fillRect(i, groundY + 2, 10, h);
      }

      ctx.fillStyle = '#90ff8f';
      state.obstacles.forEach((ob) => {
        const top = ob.y - ob.h;
        ctx.fillRect(ob.x, top, ob.w, ob.h);
        ctx.fillRect(ob.x - 2, top + 10, ob.w + 4, 4);
      });

      drawDino(state.player);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space' || event.code === 'ArrowUp') {
        event.preventDefault();
        jump();
      }
    });

    jumpBtn.addEventListener('click', jump);
    startBtn.addEventListener('click', () => {
      reset();
      jump();
    });
    canvas.addEventListener('pointerdown', jump);

    reset();
    state.running = false;
    loop();
    scoreLabel.textContent = `SCORE: 00000 | BEST: ${String(best).padStart(5, '0')}`;
  </script>
</body>
</html>
